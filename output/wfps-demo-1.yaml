apiVersion: icp4a.ibm.com/v1
kind: WfPSRuntime
metadata:
  name: wfps-demo-1
  namespace: cp4ba-wfps-production
spec:
  appVersion: "25.0.1"
  license:
    accept: true
  deploymentLicense: "production"
  admin:
    username: cp4admin

  capabilities: 
    federate:
      enable: false

    fullTextSearch:
      enable: false
      esStorage:
        storageClassName: ocs-external-storagecluster-ceph-rbd
        size: "10Gi"
      esSnapshotStorage:
        storageClassName: ocs-external-storagecluster-ceph-rbd
        size: "2Gi"

  tls:
    serverTrustCertificateList: []
  persistent:
    storageClassName: ocs-external-storagecluster-cephfs
  image:
    imagePullPolicy: IfNotPresent
    #repository: "${WFPS_PATCHED_IMG:-cp.icr.io/cp/cp4a/workflow-ps/workflow-ps-server}"
    #tag: ""
  node:
    resources:
      limits:
        cpu: 3000m
        memory: 3072Mi
      requests:
        cpu: 500m
        memory: 1024Mi

  database:
    external:
      serverName: my-postgres-1-for-cp4ba-rw.cp4ba-wfps-production.svc.cluster.local
      port: 5432
      type: postgresql
      databaseName:	wfpsdb1
      current_schema: wfpsdb
      dbCredentialSecret:	wfpsdb1-secret # The secret key must include the username and password      
      enableSSL: false
      sslMode: require
    client:
      maxConnectionPoolSize: 200
      minConnectionPoolSize: 50
