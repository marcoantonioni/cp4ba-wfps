apiVersion: icp4a.ibm.com/v1
kind: WfPSRuntime
metadata:
  name: wfps-demo-3
  namespace: cp4ba-wfps-prod-liveinst
spec:
  admin:
    username: cpadmin
  license:
    accept: true
  
    
  persistent:
    storageClassName: ocs-external-storagecluster-cephfs
  appVersion: "25.0.0"
  image:
    imagePullPolicy: IfNotPresent
    repository: "cp.icr.io/cp/cp4a/workflow-ps/workflow-ps-server"
    tag: "25.0.0"
  deploymentLicense: production
  node:
    resources:
      limits:
        cpu: 3000m
        memory: 3072Mi
      requests:
        cpu: 500m
        memory: 1024Mi
