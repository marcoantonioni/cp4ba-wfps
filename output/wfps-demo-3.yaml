apiVersion: icp4a.ibm.com/v1
kind: WfPSRuntime
metadata:
  name: wfps-demo-3
  namespace: cp4ba-wfps-test-production
spec:
  admin:
    username: cp4admin
  license:
    accept: true
  capabilities: 
    federate:
      enable: false
    fullTextSearch:
      enable: false
      esStorage:
        storageClassName: ocs-external-storagecluster-ceph-rbd
        size: 1Gi
      esSnapshotStorage:
        storageClassName: ocs-external-storagecluster-ceph-rbd
        size: 1Gi

  persistent:
    storageClassName: ocs-external-storagecluster-cephfs
  appVersion: "25.0.1"
  deploymentLicense: "non-production"
  node:
    resources:
      limits:
        cpu: 3000m
        memory: 3072Mi
      requests:
        cpu: 500m
        memory: 1024Mi

  database:
    external:
      serverName: my-postgres-1-for-cp4ba-rw.cp4ba-wfps-test-production.svc.cluster.local
      port: 5432
      type: postgresql
      databaseName:	wfpsdb3
      current_schema: wfpsdb
      dbCredentialSecret:	wfpsdb3-secret # The secret key must include the username and password      
      enableSSL: false
      sslMode: require
    client:
      maxConnectionPoolSize: 200
      minConnectionPoolSize: 50
