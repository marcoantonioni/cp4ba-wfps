# https://www.ibm.com/docs/en/cloud-paks/cp-biz-automation/26.0.0?topic=icpd-installing-cp4ba-workflow-process-service-runtime-production-deployment
# https://www.ibm.com/docs/en/cloud-paks/cp-biz-automation/26.0.0?topic=deployment-customizing-workflow-process-service-runtime#tsk_customize_wfps__liberty
# https://www.ibm.com/docs/en/cloud-paks/cp-biz-automation/26.0.0?topic=reference-cp4ba-workflow-process-service-runtime-parameters

apiVersion: icp4a.ibm.com/v1
kind: WfPSRuntime
metadata:
  name: wfps-demo-pfs-2
  namespace: cp4ba-os-bai-pfs-prod
spec:
  appVersion: "26.0.0"
  license:
    accept: true
  deploymentLicense: "production"
  admin:
    username: cp4admin
  capabilities: 
    federate:
      enable: true
    fullTextSearch:
      enable: true
      esStorage:
        storageClassName: ocs-external-storagecluster-ceph-rbd
        size: "10Gi"
      esSnapshotStorage:
        storageClassName: ocs-external-storagecluster-ceph-rbd
        size: "2Gi"
  tls:
    serverTrustCertificateList: ['wfps-trusted-cert1']
  persistent:
    data:
      enable: true
      size: 1Gi
    storageClassName: ocs-external-storagecluster-cephfs
  image:
    imagePullPolicy: IfNotPresent
  node:
    replicas: 1
    resources:
      limits:
        cpu: 3000m
        memory: 3072Mi
      requests:
        cpu: 500m
        memory: 1024Mi
    logging:
      maxFileSize: 50
      consoleFormat: json
      consoleSource: 'message,trace,accessLog,ffdc,audit'
      maxFiles: 10
      enableFilebeat: false
      consoleLogLevel: INFO
      traceFormat: ENHANCED
      messageFormat: simple
      traceSpecification: '*=info'
    processAppsLogging:
      baseFilePath: /logs/process-apps
      customProcessAppsLogPVC: ''
      customProcessAppsLogPVCSize: 1Gi
      defaultLogName: ProcessApps.log
      enableGlobal: false
      logFileSize: 80
      logNumberOfRollovers: 5
  database:
    external:
      serverName: my-postgres-1-for-cp4ba-ssl-rw.cp4ba-os-bai-pfs-prod.svc.cluster.local
      port: 5432
      type: postgresql
      databaseName:	wfpsdb2
      current_schema: wfpsdb
      dbCredentialSecret:	wfpsdb2-secret # The secret key must include the username and password      
      enableSSL: true
      dbServerCertSecret: my-db-tls-secret
      sslMode: require
    client:
      maxConnectionPoolSize: 200
      minConnectionPoolSize: 50
