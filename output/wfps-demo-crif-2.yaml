apiVersion: icp4a.ibm.com/v1
kind: WfPSRuntime
metadata:
  name: wfps-demo-crif-2
  namespace: cp4ba-crif-prod
spec:
  admin:
    username: cpadmin
  license:
    accept: true
  
    
  persistent:
    storageClassName: ocs-storagecluster-cephfs
  appVersion: "24.0.1"
  image:
    imagePullPolicy: IfNotPresent
    repository: "cp.icr.io/cp/cp4a/workflow-ps/workflow-ps-server"
    tag: "24.0.1"
  deploymentLicense: production
  node:
    resources:
      limits:
        cpu: 3000m
        memory: 3072Mi
      requests:
        cpu: 500m
        memory: 1024Mi
